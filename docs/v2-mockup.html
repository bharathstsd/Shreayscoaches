<title>Shreyas Coupons v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: mockup bar on top, then the app shell — sidebar on wide screens, header + bottom tabs when narrow (container queries, so the phone frame switches too). Single light look, matching the live app. */
:root{
  --emerald:#0F3B32; --emerald-2:#1D5C4C; --mint:#EAF3EE; --ivory:#F5F2EA; --paper:#FFFFFF;
  --ink:#18241F; --muted:#66746E; --faint:#A3ACA6; --line:#E6E1D6; --line-2:#EFEBE2;
  --gold:#B48A2C; --gold-soft:#F5ECD6; --gold-ink:#6E5212; --gold-hi:#D9B865;
  --good:#2F7D5B; --good-soft:#E3F1E9; --warn:#9A6A12; --warn-soft:#F8EDD3; --bad:#9B3530; --bad-soft:#F7E3E1;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif; --body:Jost,'Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9E5DB;color:var(--ink);font:400 15px/1.45 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}

/* ---------- mockup bar ---------- */
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#1B2622;color:#DDE6E1;font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#1B2622}
.mbar b{color:#fff;font-weight:600;letter-spacing:.02em}
.mbar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg2{display:inline-flex;background:#2A3832;border-radius:999px;padding:3px}
.seg2 button{border:0;background:transparent;color:#C9D4CE;padding:5px 12px;border-radius:999px;font-size:12.5px}
.seg2 button.on{background:var(--gold-hi);color:#1B2622;font-weight:600}
.stagewrap{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.frame{width:100%;max-width:1360px;height:min(860px,calc(100vh - 110px));min-height:620px;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(20,30,26,.18);background:var(--ivory)}
.frame.phone{max-width:392px;height:min(820px,calc(100vh - 110px));border-radius:34px;border:10px solid #1B2622}

/* ---------- app shell ---------- */
.app{container-type:inline-size;container-name:app;height:100%;display:flex;flex-direction:column;background:var(--ivory);position:relative}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line);min-height:62px}
.logo{display:flex;align-items:center;gap:8px;font:600 13px var(--body);letter-spacing:.24em;color:var(--emerald)}
.logo svg{flex:none}
.top .sp{flex:1}
.ws{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--ivory);border-radius:999px;padding:5px 12px 5px 6px;min-width:0}
.ws .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font:600 12px var(--body)}
.ws .dot.admin{background:var(--emerald);color:var(--gold-hi)}
.ws .dot.club{background:var(--gold-soft);color:var(--gold-ink)}
.ws span.t{display:flex;flex-direction:column;line-height:1.15;text-align:left;min-width:0}
.ws span.t b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws span.t i{font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--emerald);color:#fff;display:flex;align-items:center;justify-content:center;font:600 13px var(--body);flex:none;border:0}
.menu{position:absolute;top:58px;left:18px;z-index:30;width:min(340px,calc(100% - 36px));background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(20,30,26,.16);padding:8px}
.menu .h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 10px;text-align:left}
.menu button:hover,.menu button.on{background:var(--ivory)}
.menu button .t{flex:1;display:flex;flex-direction:column;line-height:1.2}
.menu button .t i{font-style:normal;font-size:12px;color:var(--muted)}
.body{flex:1;display:flex;min-height:0}
.side{display:none;flex-direction:column;gap:2px;width:228px;flex:none;padding:16px 12px;border-right:1px solid var(--line);background:var(--paper);overflow-y:auto}
.side .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 10px 4px}
.navb{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:10px;padding:9px 12px;color:var(--muted);font-size:14.5px;text-align:left;width:100%}
.navb:hover{background:var(--ivory);color:var(--ink)}
.navb.on{background:var(--mint);color:var(--emerald);font-weight:500}
.main{flex:1;overflow-y:auto;min-width:0}
.content{max-width:1120px;margin:0 auto;padding:22px 18px 96px;display:flex;flex-direction:column;gap:18px}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .navb{flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;align-items:center;justify-content:center}
.tabs .navb.on{background:transparent;color:var(--emerald)}
.tabs .navb span{white-space:nowrap;font-size:10.5px}
.ws-label{display:none}
@container app (min-width:900px){
  .side{display:flex}
  .tabs{display:none}
  .content{padding:30px 34px 40px;gap:22px}
  .ws-label{display:inline}
}
@container app (max-width:560px){
  .logo span{display:none}
  .top{padding:10px 12px;gap:8px}
}

/* ---------- type & atoms ---------- */
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
h1.pg{font:600 34px/1.05 var(--display);margin:2px 0 0;color:var(--emerald);text-wrap:balance}
h2.sec{font:600 22px/1.1 var(--display);margin:0;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
.btn{border:0;background:var(--emerald);color:#fff;border-radius:12px;padding:11px 18px;font-weight:500;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:#B9C3BE;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--emerald);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btn.block{width:100%}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr;gap:18px}
@container app (min-width:900px){
  .grid2{grid-template-columns:1.25fr 1fr}
  .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.grey{background:var(--line-2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.inp{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--paper);font-size:15px}
.inp:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex:1}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.note::before{content:"NEW";flex:none;font:600 9.5px var(--body);letter-spacing:.14em;background:var(--gold);color:#fff;border-radius:5px;padding:3px 6px;margin-top:1px}
.hide-notes .note{display:none}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.good{background:var(--good-soft);color:var(--good)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.info{background:var(--line-2);color:var(--ink)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
@container app (min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--paper);padding:18px 18px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:600 44px/1 var(--display);color:var(--emerald);font-variant-numeric:lining-nums tabular-nums}
.kpi .d{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up{color:var(--good)} .down{color:var(--bad)}
.kpi svg{width:100%;height:34px;margin-top:4px}

/* ---------- attention ---------- */
.att{display:grid;grid-template-columns:1fr;gap:10px}
@container app (min-width:900px){.att{grid-template-columns:repeat(4,minmax(0,1fr))}}
.attc{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:12px 14px;text-align:left}
.attc.bad{border-left-color:var(--bad)}
.attc.info{border-left-color:var(--emerald-2)}
.attc b{display:block;font-weight:600;font-size:14px}
.attc span{font-size:12.5px;color:var(--muted)}

/* ---------- funnel ---------- */
.fun{display:flex;flex-direction:column;gap:10px}
.fun .r{display:grid;grid-template-columns:minmax(110px,150px) 1fr 52px;gap:12px;align-items:center;font-size:13.5px}
.fun .bar{height:10px;border-radius:999px;background:var(--line-2);overflow:hidden}
.fun .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--emerald),var(--emerald-2))}
.fun .r.cv .bar i{background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.fun .n{text-align:right;font-weight:600}
.fun .p{color:var(--faint);font-weight:400;font-size:11.5px;display:block}

/* ---------- table ---------- */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.mb{display:flex;align-items:center;gap:8px;min-width:120px}
.mb .bar{flex:1;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden;min-width:60px}
.mb .bar i{display:block;height:100%;background:var(--gold)}
.rank{width:24px;height:24px;border-radius:50%;background:var(--ivory);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.rank.g{background:var(--gold-soft);color:var(--gold-ink)}

/* ---------- coupon desk ---------- */
.desk{background:var(--emerald);color:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.desk::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(217,184,101,.25)}
.desk .eyebrow{color:var(--gold-hi)}
.desk h2{font:600 28px/1.1 var(--display);margin:0;text-wrap:balance}
.deskin{display:flex;gap:10px;position:relative;z-index:1}
.deskin .pre{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:0 10px;flex:1;min-width:0}
.deskin .pre span{font:600 22px var(--display);color:var(--gold-hi)}
.deskin input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:500 22px var(--body);padding:12px 0;letter-spacing:.04em}
.deskin input::placeholder{color:rgba(255,255,255,.45);font-size:16px;letter-spacing:0}
.deskin input:focus{outline:none}
.deskin .btn{background:var(--gold-hi);color:var(--emerald);font-weight:600;flex:none}
.try{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:rgba(255,255,255,.65);position:relative;z-index:1}
.try button{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-size:12px}
.try button:hover{background:rgba(255,255,255,.1)}
.result{display:flex;flex-direction:column;gap:14px}
.coupon{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ctk{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.ctk b{font:600 30px/1 var(--display)}
.ctk i{font-style:normal;font-size:11px;letter-spacing:.1em}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.step .c{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.step.done{color:var(--good)} .step.done .c{background:var(--good);border-color:var(--good);color:#fff}
.step.now{color:var(--ink);font-weight:500} .step.now .c{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.step + .step::before{content:"";width:14px;height:1.5px;background:var(--line)}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left}
.pick button.on{border-color:var(--emerald);background:var(--mint)}
.pick button:disabled{opacity:.55;cursor:not-allowed}
.pick button .t{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pick button .t i{font-style:normal;font-size:12px;color:var(--muted)}

/* ---------- today ---------- */
.today{display:flex;flex-direction:column}
.td{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.td:last-child{border-bottom:0}
.td .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.td .ic.g{background:var(--mint);color:var(--emerald)} .td .ic.y{background:var(--gold-soft);color:var(--gold-ink)} .td .ic.r{background:var(--bad-soft);color:var(--bad)}
.td .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.td .t i{font-style:normal;font-size:12.5px;color:var(--muted)}
.td button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;font-size:12.5px;color:var(--emerald);font-weight:500;flex:none}

/* gauge */
.gauge{display:flex;align-items:center;gap:18px}
.gauge svg{flex:none}
.gauge .big{font:600 40px/1 var(--display);color:var(--emerald)}

/* checklist */
.check{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.ck:last-child{border-bottom:0}
.ck .c{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.ck.done .c{background:var(--good);border-color:var(--good);color:#fff}
.ck .t{flex:1;display:flex;flex-direction:column;line-height:1.25}
.ck .t i{font-style:normal;font-size:12.5px;color:var(--muted)}
.ck.done .t b{text-decoration:line-through;color:var(--muted);font-weight:500}
.progress{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold)}

/* login */
.login{flex:1;display:grid;grid-template-columns:1fr;overflow-y:auto}
@container app (min-width:900px){.login{grid-template-columns:1.1fr 1fr}}
.lbrand{background:var(--emerald);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:40px 36px}
.lbrand .eyebrow{color:var(--gold-hi)}
.lbrand h1{font:600 clamp(34px,6cqi,58px)/1 var(--display);margin:0;text-wrap:balance}
.lbrand p{margin:0;color:#C8DAD2;max-width:38ch}
.lform{display:flex;align-items:center;justify-content:center;padding:28px 22px}
.lform form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.segl{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--line-2)}
.segl button{border:0;background:transparent;border-radius:10px;min-height:40px;color:var(--muted);font-weight:500}
.segl button.on{background:var(--paper);color:var(--emerald);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* sheet */
.sheetbg{position:absolute;inset:0;background:rgba(15,25,21,.38);display:flex;align-items:flex-end;justify-content:center;z-index:40}
@container app (min-width:900px){.sheetbg{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px;display:flex;flex-direction:column;gap:14px}
@container app (min-width:900px){.sheet{border-radius:22px}}
/* search & filters */
.sbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--ivory);border-radius:12px;padding:8px 12px;color:var(--muted);min-width:0;flex:0 1 340px;text-align:left;font-size:14px}
.sbtn kbd{margin-left:auto;font:500 11px var(--body);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--paper)}
.sbtn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container app (max-width:700px){.sbtn{flex:none;width:40px;height:40px;padding:0;justify-content:center;border-radius:50%}.sbtn .lbl,.sbtn kbd{display:none}}
.sover{position:absolute;inset:0;z-index:45;background:rgba(15,25,21,.38);display:flex;justify-content:center;align-items:flex-start;padding:70px 14px 14px}
.sbox{width:100%;max-width:640px;max-height:100%;background:var(--paper);border-radius:18px;box-shadow:0 20px 50px rgba(15,25,21,.25);display:flex;flex-direction:column;overflow:hidden}
.sbox .in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sbox .in input{flex:1;border:0;font-size:17px;padding:6px 0;background:transparent;min-width:0}
.sbox .in input:focus{outline:none}
.sbox .scope{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.sres{overflow-y:auto;padding:6px 8px 12px}
.sres .h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px;display:flex;justify-content:space-between}
.hit{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 8px;text-align:left}
.hit:hover{background:var(--ivory)}
.hit .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--mint);color:var(--emerald)}
.hit .av.r{background:var(--gold-soft);color:var(--gold-ink);border-radius:9px}
.hit .av.c{background:var(--line-2);color:var(--muted)}
.hit .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}

}
function funnel(src){

function searchOverlay(){
  return `<div class="sover" data-act="closesearch"><div class="sbox" role="dialog" aria-label="Search">
    <div class="in">${ic('search',20,'#66746E')}<input id="gq" placeholder="Name, mobile, coupon number or Herbalife ID" value="${esc(S.sq)}" autocomplete="off" aria-label="Search"><button class="chip" data-act="closesearch">Esc</button></div>
    <div class="scope" role="group" aria-label="Search in">${[['all','Everything'],['cust','Customers'],['ref','Referrals'],['coach','Coaches']].map(([k,l])=>`<button class="chip${S.sscope===k?' on':''}" data-act="sscope" data-v="${k}">${l}</button>`).join('')}<span class="muted small" style="margin-left:auto;align-self:center">${S.ws==='admin'?'All clubs':'This club'}</span></div>
    <div class="sres" id="sres">${searchResults()}</div>
  </div></div>`;
}
function searchResults(){
  const q=S.sq.trim();
  if(!q) return `<div class="h">Try</div>${['Lakshmi','98480','#12','W2213340'].map(x=>`<button class="hit" data-act="sfill" data-v="${x}"><span class="av c">${ic('search',16)}</span><span class="t"><b>${x}</b><i>${x.startsWith('#')?'Coupon number':x.startsWith('W')?'Herbalife ID':/\d/.test(x)?'Part of a mobile number':'Name'}</i></span></button>`).join('')}${note('One search box for the whole app. It matches names, any part of a mobile number, coupon numbers and Herbalife IDs.')}`;
  const sc=S.sscope;
  const cs=sc==='all'||sc==='cust'?CUST.filter(c=>match(q,c.n,c.m)):[];
  const rs=sc==='all'||sc==='ref'?REF.filter(r=>match(q.replace('#',''),r.c,r.h,r.v)):[];
  const ks=sc==='all'||sc==='coach'?COACHL.filter(k=>match(q,k.n,k.m,k.id)):[];
  if(!cs.length&&!rs.length&&!ks.length) return `<div class="empty"><b>Nothing matches "${esc(q)}"</b><span>Check the spelling or try part of the mobile number.</span></div>`;
  const lim=sc==='all'?4:20;
  const sec=(t,arr,f)=>arr.length?`<div class="h"><span>${t}</span><span>${arr.length}</span></div>${arr.slice(0,lim).map(f).join('')}`:'';
  return sec('Customers',cs,c=>`<button class="hit" data-act="goto" data-v="customers"><span class="av">${c.n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><span class="t"><b>${hl(c.n,q)}</b><i>${hl(fmtMob(c.m),q)} · ${c.co}</i></span><span class="pill ${STAGE_PILL[c.st]}">${c.st}</span></button>`)
    +sec('Referrals',rs,r=>`<button class="hit" data-act="goto" data-v="referrals"><span class="av r">${ic('coupon',16)}</span><span class="t"><b>${hl(r.c,q.replace('#',''))}</b><i>${hl(r.h,q)}${r.v?' → '+hl(r.v,q):' · waiting for a friend'}</i></span><span class="pill ${REF_PILL[r.st]}">${r.st}</span></button>`)
    +sec('Coaches',ks,k=>`<button class="hit" data-act="goto" data-v="coaches"><span class="av c">${ic('coach',16)}</span><span class="t"><b>${hl(k.n,q)}</b><i>${hl(k.id,q)} · ${hl(fmtMob(k.m),q)}</i></span>${k.active?'':'<span class="pill grey">Inactive</span>'}</button>`);
}

/* ---------- list pages with filters ---------- */
function applied(list){
  const on=list.filter(x=>x[2]);
  if(!on.length) return '';
  return `<div class="applied"><span>Filtered by</span>${on.map(([k,l,v])=>`<span class="x"><b>${l}:</b> ${esc(v)}<button class="linkb" style="text-decoration:none;padding:0 2px" data-act="fclear" data-v="${k}" aria-label="Remove ${l} filter">✕</button></span>`).join('')}<button class="linkb" data-act="fclear" data-v="*">Clear all</button></div>`;
}
function countBy(arr,key,val){return arr.filter(x=>x[key]===val).length}
function customersPage(club){
  return `<div class="head"><div><p class="eyebrow">${esc(club.name)}</p><h1 class="pg">Customers</h1></div><button class="btn">+ New customer</button></div>
  <section class="fbar">
    <div class="top2"><label class="sinp" for="fq">${ic('search',18,'#66746E')}<input id="fq" data-list="cust" placeholder="Search name or mobile" value="${esc(S.f.q)}" autocomplete="off"></label>
      <select class="sel" id="fcoach" data-f="coach" aria-label="Coach"><option value="">All coaches</option>${COACHL.filter(k=>k.active).map(k=>`<option ${S.f.coach===k.n?'selected':''}>${k.n}</option>`).join('')}</select>
      <select class="sel" id="fjoin" data-f="join" aria-label="Joined"><option value="">Joined any time</option>${['This week','This month','Last 3 months'].map(x=>`<option ${S.f.join===x?'selected':''}>${x}</option>`).join('')}</select>
      <select class="sel" id="fsort" data-f="sort" aria-label="Sort"><option value="">Newest first</option><option ${S.f.sort==='Name A–Z'?'selected':''}>Name A–Z</option><option ${S.f.sort==='Most friends invited'?'selected':''}>Most friends invited</option></select></div>
    <div class="fchips" role="group" aria-label="Stage">${['All','New','Visitor','In trial','Trial done','CVC member'].map(s=>`<button class="chip${(S.f.stage||'All')===s?' on':''}" data-act="fstage" data-v="${s}">${s}<span class="n">${s==='All'?CUST.length:countBy(CUST,'st',s)}</span></button>`).join('')}</div>
    <div id="fapplied"></div>
  </section>
  <section class="panel" id="flist"></section>
  ${note('Search as you type, one tap for a stage, and dropdowns for coach, joining date and sort order. The chips show how many people are in each stage.')}`;
}
function custList(){
  const f=S.f;let r=CUST.filter(c=>match(f.q,c.n,c.m)&&(!f.stage||f.stage==='All'||c.st===f.stage)&&(!f.coach||c.co===f.coach));
  if(f.join==='This week')r=r.filter(c=>/Nov/.test(c.j)&&parseInt(c.j)>=18);else if(f.join==='This month')r=r.filter(c=>/Nov/.test(c.j));else if(f.join==='Last 3 months')r=r.filter(c=>/Sep|Oct|Nov/.test(c.j));
  if(f.sort==='Name A–Z')r=[...r].sort((a,b)=>a.n.localeCompare(b.n));if(f.sort==='Most friends invited')r=[...r].sort((a,b)=>b.inv-a.inv);
  document.getElementById('fapplied').innerHTML=applied([['q','Search',f.q],['stage','Stage',f.stage&&f.stage!=='All'?f.stage:''],['coach','Coach',f.coach],['join','Joined',f.join]]);
  if(!r.length) return `<div class="empty"><b>No customers match these filters</b><button class="linkb" data-act="fclear" data-v="*">Clear filters</button></div>`;
  return `<div class="muted small">${r.length} of ${CUST.length} customers</div>
    <div class="tw tblonly"><table><thead><tr><th>Name</th><th>Mobile</th><th>Stage</th><th>Coach</th><th class="r">Friends invited</th><th class="r">Joined</th></tr></thead><tbody>${r.map(c=>`<tr><td><b style="font-weight:500">${hl(c.n,f.q)}</b></td><td class="num">${hl(fmtMob(c.m),f.q)}</td><td><span class="pill ${STAGE_PILL[c.st]}">${c.st}</span></td><td>${c.co}</td><td class="r num">${c.inv||'—'}</td><td class="r muted">${c.j}</td></tr>`).join('')}</tbody></table></div>
    <div class="cards">${r.map(c=>`<div class="pc"><span class="t"><b>${hl(c.n,f.q)}</b><i>${hl(fmtMob(c.m),f.q)} · ${c.co}</i></span><span class="pill ${STAGE_PILL[c.st]}">${c.st}</span></div>`).join('')}</div>`;
}
function referralsPage(club){
  return `<div class="head"><div><p class="eyebrow">${esc(club.name)}</p><h1 class="pg">Referrals</h1></div><button class="btn ghost" data-act="page" data-v="desk">Open coupon desk</button></div>
  <section class="fbar">
    <div class="top2"><label class="sinp" for="fq">${ic('search',18,'#66746E')}<input id="fq" data-list="ref" placeholder="Coupon number, holder or friend" value="${esc(S.f.q)}" autocomplete="off"></label>
      <select class="sel" id="fcoach" data-f="coach" aria-label="Coach"><option value="">All coaches</option>${COACHL.filter(k=>k.active).map(k=>`<option ${S.f.coach===k.n?'selected':''}>${k.n}</option>`).join('')}</select>
      <select class="sel" id="fbatch" data-f="batch" aria-label="Batch"><option value="">All batches</option>${['PB-0001','PB-0002'].map(x=>`<option ${S.f.batch===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="fchips" role="group" aria-label="Status">${['All','Waiting','Day 1 done','Day 2 done','Expired','Paused'].map(s=>`<button class="chip${(S.f.stage||'All')===s?' on':''}" data-act="fstage" data-v="${s}">${s==='Waiting'?'Waiting for friend':s}<span class="n">${s==='All'?REF.length:countBy(REF,'st',s)}</span></button>`).join('')}</div>
    <div id="fapplied"></div>
  </section>
  <section class="panel" id="flist"></section>
  ${note('Every coupon given out, with its holder, the friend who used it and where it stands. Filter by status to chase Day 2 visits or coupons about to expire.')}`;
}
function refList(){
  const f=S.f;const q=(f.q||'').replace('#','');
  const r=REF.filter(x=>match(q,x.c,x.h,x.v)&&(!f.stage||f.stage==='All'||x.st===f.stage)&&(!f.coach||x.co===f.coach)&&(!f.batch||x.c.startsWith(f.batch)));
  document.getElementById('fapplied').innerHTML=applied([['q','Search',f.q],['stage','Status',f.stage&&f.stage!=='All'?f.stage:''],['coach','Coach',f.coach],['batch','Batch',f.batch]]);
  if(!r.length) return `<div class="empty"><b>No referrals match these filters</b><button class="linkb" data-act="fclear" data-v="*">Clear filters</button></div>`;
  return `<div class="muted small">${r.length} of ${REF.length} coupons</div>
    <div class="tw tblonly"><table><thead><tr><th>Coupon</th><th>Given to</th><th>Friend</th><th>Status</th><th>Coach</th><th class="r">Issued</th><th class="r">Valid until</th></tr></thead><tbody>${r.map(x=>`<tr><td><b style="font-weight:500">${hl(x.c,q)}</b></td><td>${hl(x.h,q)}</td><td>${x.v?hl(x.v,q):'<span class="muted">—</span>'}</td><td><span class="pill ${REF_PILL[x.st]}">${x.st}</span></td><td>${x.co}</td><td class="r muted">${x.is}</td><td class="r ${x.st==='Expired'?'':'muted'}">${x.ex}</td></tr>`).join('')}</tbody></table></div>
    <div class="cards">${r.map(x=>`<div class="pc"><span class="t"><b>${hl(x.c,q)}</b><i>${hl(x.h,q)}${x.v?' → '+hl(x.v,q):' · waiting for a friend'} · until ${x.ex}</i></span><span class="pill ${REF_PILL[x.st]}">${x.st}</span></div>`).join('')}</div>`;
}
function coachesPage(club){
  return `<div class="head"><div><p class="eyebrow">${esc(club.name)}</p><h1 class="pg">Wellness coaches</h1></div><button class="btn">+ Add coach</button></div>
  <section class="fbar">
    <div class="top2"><label class="sinp" for="fq">${ic('search',18,'#66746E')}<input id="fq" data-list="coach" placeholder="Name, mobile or Herbalife ID" value="${esc(S.f.q)}" autocomplete="off"></label>
      <select class="sel" id="fsort" data-f="sort" aria-label="Sort"><option value="">Most CVC first</option>${['Most coupons issued','Name A–Z'].map(x=>`<option ${S.f.sort===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="fchips" role="group" aria-label="Status">${['All','Active','Inactive'].map(s=>`<button class="chip${(S.f.stage||'Active')===s?' on':''}" data-act="fstage" data-v="${s}">${s}<span class="n">${s==='All'?COACHL.length:COACHL.filter(k=>k.active===(s==='Active')).length}</span></button>`).join('')}</div>
    <div id="fapplied"></div>
  </section>
  <section class="panel" id="flist"></section>`;
}
function coachList(){
  const f=S.f;const st=f.stage||'Active';
  let r=COACHL.filter(k=>match(f.q,k.n,k.m,k.id)&&(st==='All'||k.active===(st==='Active')));
  r=[...r].sort(f.sort==='Name A–Z'?(a,b)=>a.n.localeCompare(b.n):f.sort==='Most coupons issued'?(a,b)=>b.issued-a.issued:(a,b)=>b.cvc-a.cvc||b.issued-a.issued);
  document.getElementById('fapplied').innerHTML=applied([['q','Search',f.q],['stage','Status',st!=='Active'?st:'']]);
  if(!r.length) return `<div class="empty"><b>No coaches match</b><button class="linkb" data-act="fclear" data-v="*">Clear filters</button></div>`;
  return `<div class="tw tblonly"><table><thead><tr><th>Coach</th><th>Herbalife ID</th><th>Mobile</th><th>Upline</th><th class="r">Customers</th><th class="r">Coupons</th><th class="r">Trials</th><th class="r">CVC</th></tr></thead><tbody>${r.map(k=>`<tr><td><b style="font-weight:500">${hl(k.n,f.q)}</b> ${k.active?'':'<span class="pill grey">Inactive</span>'}</td><td class="num">${hl(k.id,f.q)}</td><td class="num">${hl(fmtMob(k.m),f.q)}</td><td class="muted">${k.up}</td><td class="r num">${k.cust}</td><td class="r num">${k.issued}</td><td class="r num">${k.trials}</td><td class="r"><span class="pill ${k.cvc?'good':'grey'}">${k.cvc}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="cards">${r.map(k=>`<div class="pc"><span class="t"><b>${hl(k.n,f.q)}</b><i>${hl(k.id,f.q)} · ${k.cust} customers · ${k.issued} coupons</i></span><span class="pill ${k.cvc?'good':'grey'}">${k.cvc} CVC</span></div>`).join('')}</div>`;
}
function fillList(){
  const el=document.getElementById('flist');if(!el)return;
  el.innerHTML=S.page==='customers'?custList():S.page==='referrals'?refList():coachList();
}

/* ---------- render ---------- */
function render(){
  if(S.screen==='login'){app.innerHTML=login();return}
  const club=S.ws==='admin'?null:CLUBS.find(c=>'club:'+c.id===S.ws);
  let inner;
  if(club){
    inner = S.page==='home'?clubHome(club)
      : S.page==='desk'?`<div><p class="eyebrow">${esc(club.name)}</p><h1 class="pg">Coupon desk</h1></div>${deskBox(true)}${S.desk?`<section class="panel">${deskResult()}</section>`:'<div class="placeholder"><b>Ready for the next coupon</b><span>Type the printed number. The desk shows the one thing to do next.</span></div>'}`
      : S.page==='customers'?customersPage(club)
      : S.page==='referrals'?referralsPage(club)
      : S.page==='programs'?placeholder('Trials & CVC','Trial days are marked in order and lock once the trial coupon is given. Weekly results get a valid week, sensible weight and waist limits, and approved awards can\'t be overwritten.')
      : coachesPage(club);
  } else {
    inner = S.page==='overview'?overview()
      : S.page==='coupons'?coupons()
      : S.page==='clubs'?placeholder('Clubs','Each club shows its owner, setup progress and health. Removing the only Owner login now asks you to confirm.')
      : S.page==='resets'?placeholder('Password resets','Unchanged: requests from the login page plus "reset any Club Owner now".')
      : S.page==='import'?placeholder('Import from Excel','Unchanged: check first, then create clubs, owners and coaches.')
      : placeholder('Activity','Logins and changes, now filterable by club and date.');
  }
  app.innerHTML=shell(inner);
  fillList();
}

/* ---------- events ---------- */
function openSearch(){S.search=true;S.menu=false;render();const g=document.getElementById('gq');if(g){g.focus();g.setSelectionRange(g.value.length,g.value.length)}}
document.addEventListener('input',e=>{
  if(e.target.id==='gq'){S.sq=e.target.value;document.getElementById('sres').innerHTML=searchResults();return}
  if(e.target.id==='fq'){S.f.q=e.target.value;fillList();return}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k){S.f[k]=e.target.value;fillList()}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&S.screen==='app'&&!S.search&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openSearch()}
  else if(e.key==='Escape'&&S.search){S.search=false;render()}
});
function setDesk(n){S.desk=n;S.deskNum=n;S.issued=false;S.d2=false;S.trial=false;S.visit={mob:'',err:'',ok:false};S.issue={purpose:'TRIAL',cust:null,newCust:false};}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(S.menu && !e.target.closest('.menu') && !(t&&t.dataset.act==='menu')){S.menu=false;render();if(!t)return}
  if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(t.tagName==='FORM')return;
  if(a==='closesheet'){if(e.target===t||t.tagName==='BUTTON'){S.sheet=null;render()}return}
  if(a==='opensearch'){openSearch();return}
  if(a==='closesearch'){if(e.target===t||t.tagName==='BUTTON'){S.search=false;render()}return}
  if(a==='sscope'){S.sscope=v;document.getElementById('sres').innerHTML=searchResults();document.querySelectorAll('.scope .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.getElementById('gq').focus();return}
  if(a==='sfill'){S.sq=v;const g=document.getElementById('gq');g.value=v;g.focus();document.getElementById('sres').innerHTML=searchResults();return}
  if(a==='goto'){S.search=false;if(S.ws==='admin'){S.ws='club:1'}S.page=v;S.f={q:S.sq.replace(/^#/,'')};render();return}
  if(a==='fstage'){S.f.stage=v;document.querySelectorAll('.fchips .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===v));fillList();return}
  if(a==='fclear'){if(v==='*'){S.f={q:''}}else{S.f[v]='';if(v==='stage')S.f.stage=''}render();return}
  if(a==='device'){const ph=v==='phone';document.getElementById('frame').classList.toggle('phone',ph);document.getElementById('dPh').classList.toggle('on',ph);document.getElementById('dLap').classList.toggle('on',!ph);return}
  if(a==='notes'){const on=v==='1';document.body.classList.toggle('hide-notes',!on);document.getElementById('nOn').classList.toggle('on',on);document.getElementById('nOff').classList.toggle('on',!on);return}
  if(a==='jump'){S.menu=false;S.sheet=null;if(v==='login'){S.screen='login'}else{S.screen='app';if(v==='admin'){S.ws='admin';S.page='overview'}if(v==='club'){S.ws='club:1';S.page='home'}if(v==='newclub'){S.ws='club:7';S.page='home'}}setDesk(null);S.deskNum='';render();return}
  if(a==='portal'){S.portal=v;render();return}
  if(a==='menu'){S.menu=!S.menu;render();return}
  if(a==='ws'){S.ws=v;S.menu=false;S.page=v==='admin'?'overview':'home';setDesk(null);S.deskNum='';render();return}
  if(a==='page'){S.page=v;S.f={q:''};setDesk(null);S.deskNum='';render();return}
  if(a==='logout'){S.screen='login';render();return}
  if(a==='range'){S.range=v;render();return}
  if(a==='try'){setDesk(v);if(S.page!=='home'&&S.page!=='desk')S.page='home';render();const p=document.querySelector('.panel');p&&p.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  if(a==='reset'){setDesk(null);S.deskNum='';render();document.getElementById('dn')?.focus();return}
  if(a==='cust'){S.issue.cust=v;S.issue.newCust=false;render();return}
  if(a==='newcust'){S.issue.newCust=true;render();return}
  if(a==='purpose'){S.issue.purpose=v;render();return}
  if(a==='doissue'){if(S.issue.newCust){S.issue.cust=(document.getElementById('nn')||{}).value||'New customer'}S.issued=true;render();return}
  if(a==='vtry'){S.visit.mob=v;S.visit.err='';const n=document.getElementById('vn');S.visit.name=n?n.value:'';render();return}
  if(a==='d2'){S.d2=true;render();return}
  if(a==='trial'){S.trial=true;render();return}
  if(a==='sheet'){S.sheet=v;render();return}
  if(a==='bval'){S.batchValid=+v;render();return}
});
document.addEventListener('submit',e=>{
  const f=e.target,a=f.dataset.act;e.preventDefault();
  if(a==='login'){S.screen='app';S.menu=false;if(S.portal==='club'){S.ws='club:1';S.page='home'}else{S.ws='admin';S.page='overview'}render();return}
  if(a==='desk'){const n=(document.getElementById('dn').value||'').replace(/\D/g,'');if(!n)return;setDesk(n);render();return}
  if(a==='visitmob'){
    const mob=document.getElementById('vm').value.replace(/\D/g,''),name=document.getElementById('vn').value.trim();
    S.visit.mob=document.getElementById('vm').value;S.visit.name=name;
    if(mob.length!==10||!/^[6-9]/.test(mob)) S.visit.err='Enter a 10-digit mobile number starting with 6, 7, 8 or 9.';
    else if(mob==='9963044118') S.visit.err='<b>Anitha P has already visited as a friend</b> (coupon PB-0001 #3 at Shreyas · Kadapa, 05 Nov). A person can be a referral visitor only once.';
    else if(mob==='9848011223') S.visit.err='<b>This is the coupon holder\'s own number.</b> Lakshmi Devi can\'t use her own coupon. Give it to a friend.';
    else if(!name) S.visit.err='Enter the friend\'s name.';
    else {S.visit.ok=true;S.visit.err=''}
    render();return;
  }
});
render();
})();
</script>

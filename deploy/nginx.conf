# Shreyas Coupons PWA + API — installed by setup.sh as /etc/nginx/sites-available/shreyas-coupons
server {
    listen 80;
    server_name __DOMAIN__;

    root __APP__/frontend/dist;
    index index.html;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://unix:/run/shreyas-coupons/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /django-admin/ {
        proxy_pass http://unix:/run/shreyas-coupons/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { alias __APP__/backend/staticfiles/; expires 30d; }

    # the service worker and app shell must always be fresh so updates reach phones
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
